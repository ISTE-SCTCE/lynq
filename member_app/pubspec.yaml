name: member_app
description: "ISTE Member App - Student Portal"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Supabase
  supabase_flutter: ^2.12.4
  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  # Navigation
  go_router: ^17.0.0
  # UI/Design
  google_fonts: ^6.3.2
  # QR
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  # Charts/Progress
  percent_indicator: ^4.2.3
  fl_chart: ^0.69.0
  # Utils
  intl: ^0.20.2
  url_launcher: ^6.3.0
  crypto: ^3.0.6
  # File handling
  path_provider: ^2.1.5
  # PDF
  pdf: ^3.11.3
  printing: ^5.14.3
  # Share
  share_plus: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^2.4.3
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/

  fonts:
    - family: Qurova
      fonts:
        - asset: assets/fonts/qurova-demo.regular.otf

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
